version: '3.8'

services:
  portal-treinamentos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal-treinamentos
    ports:
      - "8787:8787"
    volumes:
      - portal_data:/app/data
      - portal_uploads:/app/uploads
    restart: unless-stopped
    environment:
      - PORT=8787
      - PDF_EXTRACT_PROVIDER
      - MISTRAL_API_KEY
      - MISTRAL_OCR_MODEL
      - MISTRAL_OCR_URL
      - GROQ_API_KEY
      - GROQ_CHAT_URL
      - GROQ_TRAINING_MODEL
    env_file:
      - .env



volumes:
  portal_data:
    name: portal-treinamentos-data
  portal_uploads:
    name: portal-treinamentos-uploads
